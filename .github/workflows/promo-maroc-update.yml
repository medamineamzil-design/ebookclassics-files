name: Promo Maroc – mise à jour quotidienne des promotions

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6 h 17 (heure du Maroc, UTC+1)
  workflow_dispatch:
    inputs:
      only:
        description: "Identifiants de sources à collecter (séparés par des virgules), vide = toutes"
        required: false

permissions:
  contents: write

concurrency:
  group: promo-maroc-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: promo-maroc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests des analyseurs
        run: node --test scripts/test/parsers.test.mjs

      - name: Collecte des promotions
        env:
          ONLY: ${{ inputs.only }}
        run: node scripts/update-promos.mjs ${ONLY:+--only="$ONLY"}

      - name: Enregistrer les nouvelles promotions
        run: |
          git config user.name "promo-maroc-bot"
          git config user.email "promo-maroc-bot@users.noreply.github.com"
          git add data/promotions.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Promo Maroc : promotions du $(date -u +%F)"
            git push
          fi
