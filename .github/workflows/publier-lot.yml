# BookClassics — publication automatique des lots, sans PC ni VPS.
# Le bibliothécaire (Routine Claude, chaque matin) pousse _inbox/lot-AAAA-MM-JJ.json sur une branche claude/… ;
# ce workflow le publie avec auto.sh (EPUB/PDF/TXT/HTML, site ; les MP3 sont ajoutés la nuit par audio-lot.yml), puis range le lot
# dans _inbox/faits/ (ou _inbox/erreurs/) sur main ; un lot en erreur est retenté au prochain passage et écrit le journal dans _rapports/journal/.
name: Publier le lot du jour

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["_inbox/lot-*.json"]
  workflow_dispatch:

concurrency:
  group: publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Lot(s) reçu(s)
        uses: actions/checkout@v4
        with:
          path: recu
          fetch-depth: 1

      - name: Dépôt des livres (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: ebookclassics-files
          fetch-depth: 1

      - name: Dépôt du site
        uses: actions/checkout@v4
        with:
          repository: medamineamzil-design/ebookclassics-site
          token: ${{ secrets.SITE_TOKEN }}
          path: ebookclassics-site
          fetch-depth: 1

      - name: Logiciels (pandoc, typst, rsvg, Pillow)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pandoc librsvg2-bin python3-pil
          curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
          sudo mv typst-*/typst /usr/local/bin/

      - name: Préparation
        run: |
          mv ebookclassics-files ebookclassics-site ~/
          for r in ~/ebookclassics-files ~/ebookclassics-site; do
            git -C $r config user.name "BookClassics (automatique)"
            git -C $r config user.email "medamine.amzil@gmail.com"
          done
          mkdir -p ~/bookclassics-auto/inbox ~/bookclassics-auto/faits ~/bookclassics-auto/erreurs
          # seulement les lots jamais traités
          for f in recu/_inbox/lot-*.json; do
            [ -e "$f" ] || continue
            n=$(basename "$f")
            if [ -e ~/ebookclassics-files/_inbox/faits/$n ]; then
              echo "déjà publié : $n"
            else
              cp "$f" ~/bookclassics-auto/inbox/ && echo "à publier : $n"
            fi
          done
          # Rattrapage : livre déjà déposé dans le dépôt des fichiers mais absent du site (publication interrompue).
          # Retiré de la copie locale seulement, pour que publier_lot.py le refasse et mette le site à jour.
          for f in ~/bookclassics-auto/inbox/lot-*.json; do
            [ -e "$f" ] || continue
            python3 -c '
          import json, os, shutil, sys
          sys.path.insert(0, os.path.expanduser("~/ebookclassics-site/_auto"))
          import ebooks_build as EB
          for b in json.load(open(sys.argv[1], encoding="utf-8")).get("books", []):
              s = EB.slug_of(b["title"])
              d = os.path.expanduser("~/ebookclassics-files/" + s)
              if os.path.isdir(d) and not os.path.exists(os.path.expanduser("~/ebookclassics-site/books/" + s)):
                  shutil.rmtree(d)
                  print("rattrapage :", s, "(dans les fichiers, absent du site)")
          ' "$f"
          done
          # Pas de livres audio ici : ils sont ajoutés chaque nuit par « Ajouter les audios » (audio-lot.yml).

      - name: Publication (auto.sh)
        run: |
          mkdir -p ~/journal
          J=~/journal/publication-$(TZ=Europe/Paris date +%F-%H%M).txt
          bash ~/ebookclassics-site/_auto/auto.sh 2>&1 | tee "$J"
          echo "JOURNAL=$J" >> $GITHUB_ENV

      - name: Diagnostic des droits d'écriture sur le site
        if: always()
        run: git -C ~/ebookclassics-site push --dry-run 2>&1 | tail -5 || true

      - name: Ranger le lot et le journal sur main
        if: always()
        run: |
          rm -f ~/r2.conf
          cd ~/ebookclassics-files
          git pull -q --rebase --autostash || true
          mkdir -p _inbox/faits _inbox/erreurs _rapports/journal
          for f in ~/bookclassics-auto/faits/lot-*.json; do [ -e "$f" ] && cp "$f" _inbox/faits/ && rm -f "_inbox/erreurs/$(basename "$f")"; done
          cp ~/bookclassics-auto/erreurs/lot-*.json _inbox/erreurs/ 2>/dev/null || true
          [ -n "$JOURNAL" ] && cp "$JOURNAL" _rapports/journal/
          git add _inbox _rapports/journal
          git commit -q -m "Journal de publication $(TZ=Europe/Paris date +%F)" || exit 0
          for i in 1 2 3; do git push -q && break; git pull -q --rebase; done
